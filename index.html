/* ============ Jetons de design (verre dépoli menthe et aqua) ============ */
:root{
  color-scheme: light;
  --bg:#B9E6D7;
  --bg-grad:linear-gradient(135deg,#BFECD7 0%,#A9DED8 46%,#93C5D7 100%);
  --deco-dark:#5E90B3; --deco-light:rgba(255,255,255,.55); --deco-sphere:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,255,255,.25));
  --bar:rgba(185,230,215,.55);
  --glass:rgba(255,255,255,.40); --glass-strong:rgba(255,255,255,.66); --white:rgba(255,255,255,.88); --surface-solid:#FFFFFF; --field:rgba(255,255,255,.94);
  --glass-border:rgba(255,255,255,.7);
  --ink:#16303B; --ink-2:#47636E; --line:rgba(22,48,59,.12); --line-strong:rgba(22,48,59,.30);
  --primary:#247E8A; --primary-ink:#FFFFFF; --primary-soft:rgba(36,126,138,.16); --primary-press:#1B6670;
  --btn-ink:#0F3A44; --teal-1:#5FBAC4; --teal-2:#8DD4D5; --teal-ink:#06303A;
  --tile:linear-gradient(145deg,#62BEC8,#3E9DA9);
  --shadow:0 18px 40px rgba(46,110,132,.18);
  --shadow-sm:0 6px 16px rgba(46,110,132,.14);
  --m-ok:#1E9A6A; --m-high:#E8A010; --m-vhigh:#D9480F; --m-low:#C2185B;
  --t-ok:#0B6944; --t-high:#7F4B00; --t-vhigh:#9C2A0B; --t-low:#9D1049;
  --b-ok:#DDF3E8; --b-high:#FFF0D0; --b-vhigh:#FDE6DF; --b-low:#FCE4EE;
  --band-light:rgba(30,154,106,.12); --band-dark:rgba(30,154,106,.24);
  --area-top:rgba(36,126,138,.30); --area-bot:rgba(36,126,138,0);
  --chart-line:#7FA3AD; --chart-muted:#5F8089;
  --danger:#B42318; --toast-link:#9FE3DD;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

    color-scheme: dark;
    --bg:#0D2A2F; --bg-grad:linear-gradient(135deg,#0E2D31 0%,#0F3438 46%,#122F40 100%);
    --deco-dark:#1F5576; --deco-light:rgba(255,255,255,.08); --deco-sphere:radial-gradient(circle at 35% 35%,rgba(255,255,255,.16),rgba(255,255,255,.03));
    --bar:rgba(13,42,47,.62);
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --white:rgba(28,66,72,.82); --surface-solid:#1B434A; --field:rgba(8,30,34,.72);
    --glass-border:rgba(255,255,255,.14);
    --btn-ink:#0B2F38; --ink:#E4F3F2; --ink-2:#A6C2C3; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.32);
    --primary:#52C3CC; --primary-ink:#042328; --primary-soft:rgba(82,195,204,.2); --primary-press:#76D3DA;
    --teal-1:#4DB4BE; --teal-2:#79CCD0; --teal-ink:#032329;
    --tile:linear-gradient(145deg,#4BB5BF,#2E8E9A);
    --shadow:0 18px 40px rgba(0,0,0,.4); --shadow-sm:0 6px 16px rgba(0,0,0,.28);
    --m-ok:#3DD598; --m-high:#FFC145; --m-vhigh:#FF7A4D; --m-low:#FF5C9A;
    --t-ok:#7BE6B6; --t-high:#FFD27A; --t-vhigh:#FFA583; --t-low:#FF9BC0;
    --b-ok:#12392B; --b-high:#3F3112; --b-vhigh:#4A2216; --b-low:#4A1530;
    --band-light:rgba(61,213,152,.10); --band-dark:rgba(61,213,152,.20);
    --area-top:rgba(82,195,204,.34); --area-bot:rgba(82,195,204,0);
    --chart-line:#5F8A91; --chart-muted:#8FB4BA;

  }
}

    color-scheme: dark;
    --bg:#0D2A2F; --bg-grad:linear-gradient(135deg,#0E2D31 0%,#0F3438 46%,#122F40 100%);
    --deco-dark:#1F5576; --deco-light:rgba(255,255,255,.08); --deco-sphere:radial-gradient(circle at 35% 35%,rgba(255,255,255,.16),rgba(255,255,255,.03));
    --bar:rgba(13,42,47,.62);

    --glass-border:rgba(255,255,255,.14);
    --btn-ink:#0B2F38; --ink:#E4F3F2; --ink-2:#A6C2C3; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.32);
    --primary:#52C3CC; --primary-ink:#042328; --primary-soft:rgba(82,195,204,.2); --primary-press:#76D3DA;

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background-color:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;min-height:100%;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;position:relative}
body.no-scroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
small{font-size:.8em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:12px}
.muted{color:var(--ink-2)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Cercles décoratifs (derrière le verre) */
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco i{position:absolute;border-radius:50%;display:block}
.deco .d1{left:-100px;top:34%;width:230px;height:230px;background:var(--deco-dark);opacity:.9}
.deco .d2{right:-80px;bottom:16%;width:200px;height:200px;background:var(--deco-dark);opacity:.9}
.deco .d3{left:50%;top:-80px;width:180px;height:180px;margin-left:-40px;background:var(--deco-sphere)}
.deco .d4{right:-40px;top:20%;width:120px;height:120px;background:var(--deco-light)}
.deco .d5{left:18px;top:14px;width:48px;height:48px;background:var(--deco-light)}
.deco .d6{right:40px;bottom:5%;width:64px;height:64px;background:var(--deco-light)}

/* ============ Surfaces ============ */
.glass-panel,.glass{background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15)}
.white-card,.panel,.stat,.empty,.banner,.card,.item,.slot,.row,.mini-card{background:var(--white);border:1px solid var(--glass-border);box-shadow:var(--shadow-sm);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass-panel,.glass,.white-card,.panel,.stat,.empty,.banner,.card,.item,.slot,.row,.mini-card,.tabbar-in,.sheet-foot,.bsheet{background:var(--surface-solid)}
}

/* ============ Statuts ============ */
.s-ok{--sm:var(--m-ok);--st:var(--t-ok);--sb:var(--b-ok)}
.s-high{--sm:var(--m-high);--st:var(--t-high);--sb:var(--b-high)}
.s-vhigh{--sm:var(--m-vhigh);--st:var(--t-vhigh);--sb:var(--b-vhigh)}
.s-low{--sm:var(--m-low);--st:var(--t-low);--sb:var(--b-low)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px 4px 11px;border-radius:999px;background:var(--sb);color:var(--st);font-weight:700;font-size:16px}
.chip svg{width:13px;height:13px;flex:none}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--sb);color:var(--sm);flex:none}
.mark svg{width:17px;height:17px}

/* ============ Structure ============ */
#app{max-width:620px;margin:0 auto;min-height:100vh;position:relative;z-index:1}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:84px;padding:12px 20px;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.profile{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--surface-solid);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;
  border:3px solid rgba(255,255,255,.8);box-shadow:var(--shadow-sm)}
.avatar svg{width:26px;height:26px}
.profile-txt{display:flex;flex-direction:column;min-width:0}
.p-name{font-size:20px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-sub{font-size:15px;color:var(--ink-2)}
.top-title{flex:1;text-align:center;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.round-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-sm);color:var(--btn-ink)}
.round-btn:active{background:#fff}
.round-btn.sm{width:42px;height:42px}
.round-btn svg.ic{width:22px;height:22px}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--line)}
.icon-btn.small{width:40px;height:40px}
#view{padding:8px 20px calc(142px + env(safe-area-inset-bottom,0px))}
#view>*+*{margin-top:20px}
h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin-top:8px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.section-head h2{min-width:0}
.section-head .muted{font-size:15px}
.link-btn{color:var(--primary);font-weight:700;font-size:15px;white-space:nowrap;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:6px}
.pad{padding:18px;border-radius:24px}
.pad>*+*{margin-top:14px}

/* Icône carrée (comme sur la maquette) */
.tile-ic,.slot-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--tile);color:#fff;flex:none;box-shadow:0 4px 10px rgba(46,110,132,.2)}
.tile-ic svg.ic,.slot-ic svg.ic{width:23px;height:23px}
.slot-ic svg:not(.ic){width:17px;height:17px}

/* ============ Barre d’onglets (verre) ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;padding:8px 10px;
  background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:32px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--ink-2);border-radius:20px;font-size:12.5px;font-weight:700;transition:transform .2s}
.tab svg.ic{width:26px;height:26px;position:relative;z-index:1}
.tab .tab-label{display:none;line-height:1;position:relative;z-index:1}
.tab[aria-current="page"]{color:var(--primary);transform:translateY(-12px)}
.tab[aria-current="page"] .tab-label{display:block}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-4px;left:50%;margin-left:-29px;width:58px;height:58px;border-radius:50%;background:var(--surface-solid);box-shadow:var(--shadow);z-index:0}
.tab-add{justify-self:center;width:62px;height:62px;margin-top:-30px;border-radius:50%;background:var(--tile);color:#fff;
  display:grid;place-items:center;box-shadow:0 12px 24px rgba(36,126,138,.4);border:5px solid rgba(255,255,255,.9)}
.tab-add:active{filter:brightness(.92)}
.tab-add svg{width:30px;height:30px;stroke-width:2.5}

/* ============ Boutons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:18px;font-weight:700;font-size:18px;width:100%;
  background:var(--field);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn:active{background:var(--line)}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);box-shadow:0 10px 20px rgba(36,126,138,.30)}
.btn-primary:active{background:var(--primary-press)}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn-danger-solid{background:var(--danger);color:var(--surface-solid);border-color:var(--danger)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--primary)}
.btn.small{min-height:44px;font-size:16px;padding:0 18px;width:auto;border-radius:14px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn-row{display:grid;gap:12px}
.btn-row.two{grid-template-columns:1fr 1fr}
.pill-btn{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:15px}

/* ============ Accueil ============ */
.hero-card{border-radius:36px;padding:22px 18px 20px;text-align:center}
.bignum{display:flex;align-items:baseline;justify-content:center;gap:10px}
.bignum .n{font-size:clamp(60px,19vw,80px);line-height:1;font-weight:700;letter-spacing:-.04em}
.bignum .u{font-size:20px;font-weight:700;color:var(--ink-2)}
.hero-cap{margin-top:8px;font-size:17px;color:var(--ink-2)}
.hero-chip{margin:14px 0 20px;display:flex;justify-content:center}
.hero-msg{margin-top:14px;font-size:16px;color:var(--ink-2);text-align:left}
.hero-card .gauge{text-align:left}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mini-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;min-width:0}
.mini-card .k{font-size:14px;color:var(--ink-2);line-height:1.2}
.mini-card .v{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.mini-card .v small{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:3px}
.mini-card>div{min-width:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio .mini-card{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 12px}
.chart-panel{border-radius:36px;padding:16px 12px 14px}
.chart-panel .section-head{padding:0 8px}
#chartBox,#homeBox{width:100%}
#chart,#homeChart{display:block;touch-action:manipulation}

/* Jauge */
.gauge{padding:0 6px}
.g-track{position:relative;height:12px;border-radius:6px;overflow:visible;background:var(--line)}
.g-seg{position:absolute;top:0;bottom:0;background:var(--sm)}
.g-seg:first-child{border-radius:6px 0 0 6px}
.g-seg:last-of-type{border-radius:0 6px 6px 0}
.g-seg+.g-seg{border-left:3px solid var(--surface-solid)}
.g-dot{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ink);border:4px solid var(--surface-solid);box-shadow:0 0 0 1.5px var(--ink)}
.g-ticks{position:relative;height:22px;margin-top:8px;font-size:14px;color:var(--ink-2)}
.g-tick{position:absolute;top:0;transform:translateX(-50%)}

/* ============ Cartes liste (planning, tension, historique) ============ */
.plan>*+*{margin-top:0}
.slots,.list{display:grid;gap:12px}
.slot,.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px;padding:12px 14px;border-radius:20px}
.slot:active,.row:active{background:#fff}
.slot.due{outline:2.5px solid var(--primary);outline-offset:-2px}
.slot.done .slot-ic{background:var(--sb);color:var(--sm);box-shadow:none}
.slot-main,.row-main{display:flex;flex-direction:column;min-width:0}
.slot-title{font-weight:700;font-size:17px;line-height:1.25}
.slot-sub{font-size:15px;color:var(--ink-2)}
.slot.done .slot-sub{color:var(--st);font-weight:700}
.slot.due .slot-sub{color:var(--primary);font-weight:700}
.slot-side{font-size:15px;font-weight:700;display:flex;align-items:center;color:var(--ink-2)}
.slot-side svg.ic{width:20px;height:20px}
.row .slot-ic{width:44px;height:44px}
.row-val{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.row-val small{font-size:14px;font-weight:400;color:var(--ink-2);margin-left:4px;letter-spacing:0}
.row-sub{font-size:15px;color:var(--ink-2)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.row-time{font-weight:700;font-size:16px}
.row-status{font-size:14px;color:var(--st);font-weight:700}
.row-note{grid-column:2 / 4;font-size:15px;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.note-card{border-radius:22px;padding:16px}
.note-card p{margin-bottom:12px;color:var(--ink-2)}
.day-head{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:10px 10px 8px;margin:0 -8px 8px;font-weight:700;font-size:17px;border-radius:16px}
.day-group+.day-group{margin-top:12px}

/* ============ Statistiques ============ */
.tir{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.tir-seg{background:var(--sm);min-width:0}
.tir-legend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;margin-top:12px;font-size:14px}
.tir-legend li{display:flex;align-items:center;gap:8px;min-width:0}
.tir-legend .dot{width:12px;height:12px;border-radius:4px;background:var(--sm);flex:none}
.tir-legend b{margin-left:auto;white-space:nowrap}
.panel{border-radius:28px;padding:18px}
.panel>*+*{margin-top:14px}

/* Anneau avec curseur */
.ring-plate{position:relative;width:min(100%,250px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--shadow);
  display:grid;place-items:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ring-plate svg{width:84%;height:84%}
.rg-bg{fill:none;stroke:rgba(255,255,255,.85);stroke-width:26}
.rg-fg{fill:none;stroke:url(#rg);stroke-width:26;stroke-linecap:round}
.rg-knob{fill:#fff;stroke:var(--primary);stroke-width:6}
.ring-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-in b{font-size:40px;letter-spacing:-.03em;line-height:1.1}
.ring-in span{font-size:15px;color:var(--ink-2)}
.ring-section{padding:6px 0}

/* ============ Contrôles ============ */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:5px;gap:4px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button{min-height:46px;border-radius:15px;font-weight:700;color:var(--ink-2);font-size:17px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow-sm)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip-btn{min-height:46px;padding:0 18px;border-radius:16px;border:1.5px solid var(--glass-border);background:var(--white);font-weight:700;font-size:16px;white-space:nowrap;flex:none;box-shadow:var(--shadow-sm)}
.chip-btn.on,.chip-btn[aria-checked="true"],.chip-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.field{display:block}
.field-label{display:block;font-weight:700;margin-bottom:8px;font-size:16px}
.field-hint{font-size:14px;color:var(--ink-2);margin-top:6px}
.input{width:100%;min-height:54px;padding:0 18px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--field);font-size:18px}
.input:focus{outline:3px solid var(--primary-soft);border-color:var(--primary)}
.fields{display:grid;gap:16px}
.fields.two{grid-template-columns:1fr 1fr}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;cursor:pointer}
.switch-row+.switch-row{border-top:1px solid var(--line)}
.sw,.sw-vis{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:16px;background:rgba(22,48,59,.18);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s;display:block}
.sw::after,.sw-vis::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked,.mrow[aria-checked="true"] .sw-vis{background:var(--teal-1);background:linear-gradient(90deg,#5FBAC4,#3E9DA9)}
.sw:checked::after,.mrow[aria-checked="true"] .sw-vis::after{transform:translateX(24px)}

/* Curseurs (réglages) */
.slider+.slider{margin-top:20px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;font-size:16px}
.slider-top b{font-size:17px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;--p:50%}
.range::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#5FBAC4 var(--p),rgba(255,255,255,.9) var(--p))}
.range::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#5FBAC4 var(--p),rgba(255,255,255,.9) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#fff;border:8px solid #4DB0BA;box-shadow:0 3px 8px rgba(46,110,132,.35)}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:8px solid #4DB0BA;box-shadow:0 3px 8px rgba(46,110,132,.35)}

/* ============ Graphique ============ */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 8px 0;font-size:14px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:7px}
.legend .sw-band{width:18px;height:12px;border-radius:3px}
.legend .sw-line{width:18px;height:4px;border-radius:2px;background:var(--primary)}
.legend svg{width:13px;height:13px}
.detail{margin:12px 8px 0;padding:12px 16px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--glass-border);min-height:62px;font-size:16px}
.detail.s-ok,.detail.s-high,.detail.s-vhigh,.detail.s-low{border-color:transparent;background:var(--sb)}
.detail strong{font-size:20px}
.detail .d-sub{color:var(--ink-2);font-size:15px}
.insights li{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.insights li+li{border-top:1px solid var(--line)}
.insights .ic-wrap{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sb);color:var(--st)}
.insights .ic-wrap svg{width:16px;height:16px;stroke-width:2.6}
.insights .info{--sb:var(--line);--st:var(--ink-2)}
.moment-table{width:100%;border-collapse:collapse;font-size:16px}
.moment-table th{font-weight:400;color:var(--ink-2);font-size:14px;text-align:right;padding:0 0 8px}
.moment-table th:first-child,.moment-table td:first-child{text-align:left}
.moment-table td{padding:11px 0;text-align:right;border-top:1px solid var(--line)}
.moment-table td:first-child{font-weight:700}
.moment-table td:not(:first-child){white-space:nowrap}
.moment-table td:last-child,.moment-table th:last-child{padding-left:16px}
.mini{display:inline-block;width:56px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--m-ok)}

/* ============ Bandeau résultat ============ */
.banner{border-radius:26px;padding:16px 8px 16px 18px;border:1.5px solid var(--sm);background:var(--sb)}
.banner-top{display:flex;align-items:center;gap:12px}
.banner-top strong{flex:1;font-size:18px}
.banner-ic{width:22px;height:22px;color:var(--sm);flex:none}
.banner-ic svg{width:22px;height:22px}
.banner p{margin:6px 40px 0 34px;font-size:16px}
.banner .label{font-weight:700;color:var(--st)}

/* ============ État vide ============ */
.empty{text-align:center;padding:34px 22px;border-radius:32px}
.empty .empty-ic{width:72px;height:72px;border-radius:20px;background:var(--tile);color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:var(--shadow-sm)}
.empty .empty-ic svg{width:30px;height:30px}
.empty h2{margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:20px}
.empty .btn-row{max-width:340px;margin:0 auto}

/* ============ Carte teal (saisie, rapport) ============ */
.entry-card{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--teal-ink);
  background:linear-gradient(135deg,var(--teal-1) 0%,var(--teal-2) 100%);border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow)}
.entry-card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.20) 38% 50%,transparent 50% 55%,rgba(255,255,255,.13) 55% 62%,transparent 62%)}
.entry-card>*{position:relative}
.ec-top{font-size:16px;font-weight:700;opacity:.85}
.ec-main{display:flex;align-items:baseline;justify-content:center;gap:12px;padding:14px 0 6px}
.ec-foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.ec-foot b{display:block;font-size:19px;line-height:1.2}
.ec-foot span{font-size:14px;opacity:.85}
.ec-right{text-align:right}
.entry-card .err{color:#7A1010;background:rgba(255,255,255,.75);display:inline-block;padding:4px 12px;border-radius:12px;margin-top:6px}
.big-input{width:100%;max-width:240px;border:0;background:transparent;text-align:center;font-size:72px;line-height:1.1;font-weight:700;letter-spacing:-.03em;padding:0;outline:none;color:var(--teal-ink)}
.big-input::placeholder{color:rgba(6,48,58,.32)}
.big-unit{font-size:20px;font-weight:700;opacity:.85}
.bp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.bp-field .input{min-height:70px;text-align:center;font-size:32px;font-weight:700;padding:0 4px;border-radius:16px;background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.7);color:var(--teal-ink)}
.bp-field .field-label{font-size:15px;margin-bottom:6px}
.bp-field .field-hint{text-align:center;margin-top:4px;color:var(--teal-ink);opacity:.8}
.rc-num{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.rc-sub{font-size:16px;opacity:.85}

/* ============ Feuilles ============ */
.sheet{position:fixed;inset:0;z-index:60;background-color:var(--bg);background-image:var(--bg-grad);display:flex;flex-direction:column;animation:sheetIn .22s ease-out;overflow:hidden}
.sheet::before,.sheet::after{content:"";position:absolute;border-radius:50%;background:var(--deco-dark);opacity:.9;pointer-events:none}
.sheet::before{left:-110px;top:38%;width:230px;height:230px}
.sheet::after{right:-90px;bottom:22%;width:190px;height:190px}
.sheet>*{position:relative;z-index:1}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;flex:none;padding:12px 20px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bar-spacer{width:48px;flex:none}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 0;width:100%;max-width:620px;margin:0 auto}
.sheet-body>*+*{margin-top:20px}
.sheet-body>.bsheet:last-child{margin-bottom:0}
.sheet-foot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass-strong);border-top:1px solid var(--glass-border);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sheet-foot-in{max-width:620px;margin:0 auto;display:grid;gap:12px}
.sheet-foot-in.two{grid-template-columns:1fr 1.4fr}
/* Feuille basse avec poignée */
.bsheet{margin:28px -20px 0;padding:12px 20px 26px;background:var(--white);border-radius:36px 36px 0 0;box-shadow:0 -12px 30px rgba(46,110,132,.14);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bsheet>*+*{margin-top:16px}
.grab{width:68px;height:6px;border-radius:3px;background:var(--tile);margin:4px auto 10px}
.mrows{display:block}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;width:100%;text-align:left;padding:14px 0;min-height:76px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .m-t{font-weight:700;font-size:18px;line-height:1.25}
.mrow .m-d{font-size:15px;color:var(--ink-2);grid-column:1}
.mrow .sw-vis{grid-column:2;grid-row:1 / 3}
.err{color:var(--danger);font-weight:700;font-size:16px;margin-top:10px}
.err[hidden]{display:none}
.preview{min-height:120px}
.preview-empty{color:var(--ink-2);text-align:center;padding:26px 12px 0}
.preview-box{display:grid;gap:14px}
.preview-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.preview-msg{font-size:16px;color:var(--ink-2)}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 14px;border-radius:20px}
.item b{display:block;font-size:17px;line-height:1.25}
.item>div{min-width:0}
.when-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.set-group>*+*{margin-top:16px}
.set-title{font-size:20px;margin-bottom:4px}
.about{font-size:15px;color:var(--ink-2)}
.about p+p{margin-top:8px}
.notice{padding:12px 16px;border-radius:16px;background:var(--b-high);color:var(--t-high);font-size:15px;font-weight:700}
.nav-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px;padding:12px 16px 12px 14px;border-radius:22px;font-weight:700}
.nav-row span.grow{flex:1;display:flex;flex-direction:column;font-size:17px}
.nav-row small{font-weight:400;color:var(--ink-2);font-size:14px}
.sched-row{display:flex;align-items:center;gap:14px;min-height:80px;padding:12px 0}
.sched-row+.sched-row{border-top:1px solid var(--line)}
.sched-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sched-main .input{min-height:46px;font-size:17px;max-width:150px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .chip-btn{min-width:0;padding:0;justify-content:center;text-align:center;border-radius:14px}
.callout{padding:18px;border-radius:24px}
.callout h3{font-size:17px;margin-bottom:4px}
.callout p{font-size:15px;color:var(--ink-2)}
.callout .btn,.callout .switch-row{margin-top:12px}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:calc(114px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:80;background:var(--ink);color:var(--surface-solid);
  padding:12px 20px;border-radius:18px;font-weight:700;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  display:flex;gap:16px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--toast-link);font-weight:700;text-decoration:underline;min-height:36px;padding:0 4px}

.install-card{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:22px}
.medal{display:block;flex:none;color:var(--ink-2)}
.goals-card{border-radius:32px;padding:16px 14px 14px}
.goals-card .section-head{padding:0 6px;margin-bottom:6px}
.goal-row{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:20px}
.goal-row+.goal-row{border-top:1px solid var(--line)}
.goal-row:active{background:var(--primary-soft)}
.goal-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.goal-txt b{font-size:17px;line-height:1.25}
.goal-txt span{font-size:14.5px;color:var(--ink-2);line-height:1.3}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--tile)}
.goals-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px 2px;font-size:14.5px;color:var(--ink-2)}
.goals-foot b{color:var(--ink)}
.level-card{border-radius:28px;padding:16px}
.level-top{display:flex;align-items:center;gap:14px}
.level-top h3{font-size:19px;line-height:1.2;margin:0}
.level-top p{font-size:14.5px;color:var(--ink-2);margin:2px 0 0}
.lv-legend{display:flex;justify-content:space-between;gap:4px;margin-top:14px}
.lv-legend li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-2);text-align:center;min-width:0;flex:1;line-height:1.2}
.lv-legend li.on{color:var(--ink);font-weight:700}
.lv-legend li.on .medal{filter:drop-shadow(0 3px 6px rgba(46,110,132,.4))}
.streak-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:26px}
.streak-card b{font-size:22px;letter-spacing:-.02em}
.streak-card span.s{display:block;font-size:14.5px;color:var(--ink-2)}
.bd-cat{margin:6px 2px 10px;font-size:18px}
.bd-row{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;padding:12px 14px;border-radius:22px}
.bd-row+.bd-row{margin-top:10px}
.bd-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.bd-txt b{font-size:16.5px;line-height:1.25}
.bd-txt span{font-size:14px;color:var(--ink-2);line-height:1.3}
.bd-row.locked .bd-txt b{color:var(--ink-2)}
.bd-meta{font-size:13.5px;font-weight:700;color:var(--t-ok)}
.bd-meta.todo{color:var(--ink-2);font-weight:400}
.badge-banner{border-radius:26px;padding:14px}
.bb-row{display:flex;align-items:center;gap:12px}
.bb-row+.bb-row{margin-top:10px}
.bb-row>div{display:flex;flex-direction:column;min-width:0}
.bb-row b{font-size:16px;line-height:1.25}
.bb-row span{font-size:14px;color:var(--ink-2)}
.bb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.news-card{border-radius:24px;padding:14px}
.news-top{display:flex;gap:12px;align-items:flex-start}
.news-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.news-actions .btn{width:auto}
.suffix{position:relative}
.suffix .input{padding-right:62px}
.suffix span{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:15px;pointer-events:none}
.bmi-box{margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:15.5px}
.bmi-box p+p{margin-top:6px}
.bmi-box .btn{margin-top:10px}
.track-sub{display:block;font-size:14px;color:var(--ink-2);font-weight:400}
.install-card.ios{grid-template-columns:auto 1fr auto}
.install-card .ic-text{display:flex;flex-direction:column;min-width:0}
.install-card .ic-text b{font-size:16px;line-height:1.25}
.install-card .ic-text span{font-size:14px;color:var(--ink-2);line-height:1.3}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:none}
  #toast,.sw,.sw::after,.sw-vis,.sw-vis::after,.tab{transition:none}
}
@media (min-width:700px){#view{padding-left:28px;padding-right:28px}}
@media print{.tabbar,.topbar,#toast,.deco{display:none}}
</style>
</head>

<div class="deco" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i><i class="d6"></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<script>
(() => {
'use strict';

/* =====================================================================
   Constantes et utilitaires
   ===================================================================== */
const MGDL = 18.016;
const DAY = 86400000;
const STORE_KEY = 'glycosuivi.v1';
const APP_VERSION = '2.3.0';
const XLSX_SRC = 'vendor/xlsx.full.min.js';
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');

const MOMENTS = [
  { id: 'fasting', label: 'Matin, à jeun', title: 'Matin', sub: 'à jeun', short: 'À jeun', icon: 'sunrise' },
  { id: 'lunch', label: 'Midi, avant repas', title: 'Midi', sub: 'avant repas', short: 'Midi', icon: 'sun' },
  { id: 'dinner', label: 'Soir, avant repas', title: 'Soir', sub: 'avant repas', short: 'Soir', icon: 'sunset' },
  { id: 'bedtime', label: 'Soir, au coucher', title: 'Soir', sub: 'au coucher', short: 'Coucher', icon: 'moon' }
];
const BP_MOMENTS = [
  { id: 'morning', label: 'Matin', title: 'Matin', sub: '', short: 'Matin', icon: 'sun' },
  { id: 'evening', label: 'Soir', title: 'Soir', sub: '', short: 'Soir', icon: 'moon' }

function chartAria(list) {

function viewHistory() {
  const et = entryTypes(); if (ui.hist !== 'all' && !et.includes(ui.hist)) ui.hist = 'all';
  const items = [];
  if (tracked('glu') && (ui.hist === 'all' || ui.hist === 'glu')) data.readings.forEach(r => items.push({ k: 'glu', r }));
  if (tracked('weight') && (ui.hist === 'all' || ui.hist === 'weight')) data.weights.forEach(r => items.push({ k: 'weight', r }));
  data.bps.forEach(r => {
    const k = (tracked('bp') && hasBP(r)) ? 'bp' : (tracked('pulse') && r.p ? 'pulse' : null);
    if (k && (ui.hist === 'all' || ui.hist === k)) items.push({ k, r });
  });
  items.sort((a, b) => b.r.t - a.r.t);
  const L = { glu: 'Glycémie', bp: 'Tension', pulse: 'Pouls', weight: 'Poids' };
  let html = et.length > 1 ? '<div class="seg" role="group" aria-label="Filtrer">' +
    [['all', 'Tout']].concat(et.map(k => [k, L[k]])).map(x => '<button data-action="hist-filter" data-id="' + x[0] + '" aria-pressed="' + (ui.hist === x[0]) + '">' + x[1] + '</button>').join('') + '</div>' : '';
  if (!items.length) return html + emptyHTML('Rien à afficher', 'Vos mesures apparaîtront ici, classées par jour. Touchez une mesure pour la modifier ou la supprimer.', !data.readings.length && !data.bps.length && !data.weights.length);

  items.forEach(x => { const d = startOfDay(x.r.t); if (!cur || cur.d !== d) { cur = { d, list: [] }; groups.push(cur); } cur.list.push(x); });
  html += '<div>' + groups.map(g => '<div class="day-group"><h2 class="day-head">' + dayLabel(g.d + 12 * 3600000) + '</h2><div class="list">' + g.list.map(x => rowHTML(x.k, x.r)).join('') + '</div></div>').join('') + '</div>';

}

function checkReminders() {
  if (!tracked('glu')) return;
  const sc = data.schedule, now = new Date();
  if (!sc.days.includes(now.getDay())) return;
  const today = dateKey(now), t0 = startOfDay(now);
  MOMENTS.forEach(m => {
    const s = sc.slots[m.id]; if (!s.on) return;
    const [h, mi] = hm(s.time), due = new Date(now); due.setHours(h, mi, 0, 0);
    const diff = now - due; if (diff < 0 || diff > 90 * 60000) return;
    const key = today + '-' + m.id; if (sc.fired[key]) return;
    if (data.readings.some(r => r.m === m.id && r.t >= t0)) return;
    const fired = {}; Object.keys(sc.fired).forEach(k => { if (k.indexOf(today) === 0) fired[k] = 1; }); fired[key] = 1; sc.fired = fired; persist();
    fireReminder(m, s.time);
    if (ui.tab === 'home' && !ui.sheet) render();
  });
}

function commitSetting(input) {
  const key = input.dataset.setting, isG = input.dataset.kind === 'glu', s = data.settings;
  const n = parseNum(input.value);
  if (!isFinite(n)) { toast('Valeur non valide'); renderSettings(); return; }
  const val = isG ? Math.round(fromDisp(n)) : input.dataset.kind === 'imc' ? Math.round(n * 2) / 2 : Math.round(n);
  const next = Object.assign({}, s, { [key]: val });
  let ok;
  if (isG) {
    const highs = [next.fastMax, next.bedMax];
    ok = next.low >= 40 && next.low <= 100 && highs.every(h => h > next.low + 5 && h <= 400) && next.vhigh > Math.max.apply(null, highs) && next.vhigh <= 600;
  } else if (input.dataset.kind === 'imc') {
    ok = next.imcMin >= 15 && next.imcMin <= next.imcMax - 2 && next.imcMax <= 29.5;
  } else if (input.dataset.kind === 'bp') {
    ok = next.sysMin >= 90 && next.sysMin < next.sysMax - 4 && next.sysMax <= 170 && next.diaMin >= 50 && next.diaMin < next.diaMax - 4 && next.diaMax <= 110;
  } else ok = next.pulseMin >= 40 && next.pulseMin < next.pulseMax - 4 && next.pulseMax <= 130;
  if (!ok) { toast('Valeur incohérente avec les autres cibles'); renderSettings(); return; }
  data.settings = next; persist(); renderSettings();
}

async function saveFile(blob, name) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: blob }); return true; }
    }
  } catch (e) { if (e && e.code === 'declined') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
function exportData() {
  const payload = { app: 'glycotens', version: 2, exportedAt: new Date().toISOString(), readings: data.readings, bps: data.bps, weights: data.weights, settings: data.settings, profile: data.profile, report: data.report, schedule: data.schedule, badges: data.badges, flags: data.flags };
  return saveFile(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), 'glycotens-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json')
    .then(ok => { if (ok) { toast('Sauvegarde exportée'); markFlag('backup'); } });
}
function importData(file) {
  if (/\.xlsx?$/i.test(file.name)) return importXlsx(file);
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j || !['glycotens', 'medizo', 'glycosuivi'].includes(j.app) || !Array.isArray(j.readings) || !Array.isArray(j.bps)) throw new Error('format');
      j.readings = j.readings.filter(r => r && isFinite(r.t) && isFinite(r.v) && typeof r.id === 'string');
      j.bps = j.bps.filter(r => r && isFinite(r.t) && isFinite(r.s) && isFinite(r.d) && typeof r.id === 'string');
      data = normalizeData(j); evalBadges();
      persist(); if (ui.sheet === 'settings') renderSettings(); render(); toast('Backup restauré (' + (data.readings.length + data.bps.length) + ' mesures)');
    } catch (e) { toast('Ce fichier n’est pas un backup GlycoTens'); }
  };
  rd.readAsText(file);
}

  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const sc = document.createElement('script'); sc.src = XLSX_SRC;
    sc.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('xlsx'));
    sc.onerror = () => rej(new Error('xlsx')); document.head.appendChild(sc);
  });
}
async function exportXlsx() {

  Object.keys(data.report).forEach(k => cfg.push(['report.' + k, data.report[k]]));

  };

async function importXlsx(file) {
  let X; try { X = await loadXlsx(); } catch (e) { toast('Le module Excel n’est pas chargé. Vérifiez votre connexion internet.'); return; }
  try {
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const rows = name => wb.Sheets[name] ? X.utils.sheet_to_json(wb.Sheets[name], { defval: '' }) : [];
    const mid = lab => (MOMENTS.concat(BP_MOMENTS).find(m => m.label === lab) || {}).id;
    const readings = rows('Glycémies').map(r => ({ id: String(r['ID']), t: Date.parse(r['Horodatage']), v: parseFloat(r['Glycémie (mg/dL)']), m: mid(r['Moment']), note: String(r['Note'] || '') }))
      .filter(r => r.id && isFinite(r.t) && isFinite(r.v));
    const bps = rows('Tension et pouls').map(r => ({ id: String(r['ID']), t: Date.parse(r['Horodatage']), s: parseInt(r['Haute (mmHg)'], 10), d: parseInt(r['Basse (mmHg)'], 10), p: r['Pouls (bpm)'] === '' ? null : parseInt(r['Pouls (bpm)'], 10), m: mid(r['Moment']), note: String(r['Note'] || '') }))
      .filter(r => r.id && isFinite(r.t) && ((isFinite(r.s) && isFinite(r.d)) || r.p))
      .map(r => isFinite(r.s) ? r : Object.assign(r, { s: null, d: null }));
    if (!wb.Sheets['Glycémies'] && !wb.Sheets['Tension et pouls'] && !wb.Sheets['Poids']) throw new Error('format');
    const weights = rows('Poids').map(r => ({ id: String(r['ID']), t: Date.parse(r['Horodatage']), kg: parseFloat(r['Poids (kg)']), note: String(r['Note'] || '') })).filter(r => r.id && isFinite(r.t) && isFinite(r.kg));
    const raw = { readings, bps, weights, settings: {}, profile: {}, report: {} };
    rows('Réglages').forEach(r => {
      const k = String(r['Clé']), v = r['Valeur'], m = /^(settings|profile|report)\.(.+)$/.exec(k);
      if (m) raw[m[1]][m[2]] = (typeof v === 'string' && v === 'true') ? true : (typeof v === 'string' && v === 'false') ? false : v;
      else if (k === 'schedule' || k === 'badges' || k === 'flags') { try { raw[k] = JSON.parse(v); } catch (e) { /* ignoré */ } }
    });
    if (typeof raw.settings.track === 'string') { try { raw.settings.track = JSON.parse(raw.settings.track); } catch (e) { delete raw.settings.track; } }
    data = normalizeData(raw); evalBadges();
    persist(); if (ui.sheet === 'settings') renderSettings(); render(); toast('Backup restauré (' + (readings.length + bps.length) + ' mesures)');
  } catch (e) { toast('Ce fichier n’est pas un backup GlycoTens'); }
}

/* Données d’exemple (générateur déterministe) */
function loadDemo() {
  let seed = 20260617;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = (m, sd) => m + sd * Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const now = Date.now(), today = startOfDay(now);
  const at = (day, h, mi) => { const d = new Date(today); d.setDate(d.getDate() - day); d.setHours(h, mi, 0, 0); return d.getTime(); };
  for (let day = 29; day >= 0; day--) {
    const trend = (day / 29) * 9;
    const slots = [['fasting', 6, 20, 128 + trend, 16, 1], ['lunch', 12, 5, 122 + trend * .6, 15, .85], ['dinner', 18, 35, 120 + trend * .6, 15, .8], ['bedtime', 22, 0, 136 + trend * .7, 18, .7]];
    slots.forEach(sl => {
      if (rnd() > sl[5]) return;
      let v = gauss(sl[3], sl[4]);
      if (rnd() < .012) v = 52 + rnd() * 14; else if (rnd() < .02) v = 250 + rnd() * 40;
      const t = at(day, sl[1], sl[2] + Math.floor(rnd() * 25));
      if (t > now) return;
      data.readings.push({ id: uid() + day, t, v: Math.round(clamp(v, 45, 330)), m: sl[0], note: '', demo: true });
    });
    [['morning', 8, 0], ['evening', 19, 30]].forEach((b, i) => {
      if (rnd() > (i ? .55 : .85)) return;
      const t = at(day, b[1], b[2] + Math.floor(rnd() * 20)); if (t > now) return;
      const s = Math.round(clamp(gauss(133 + trend * .4, 10), 98, 175)), d = Math.round(clamp(gauss(81 + trend * .2, 6), 58, 104));
      data.bps.push({ id: uid() + 'b' + day + i, t, s, d: Math.min(d, s - 25), p: Math.round(clamp(gauss(71, 6), 55, 95)), m: b[0], note: '', demo: true });
    });
  }
  if (!data.profile.height) data.profile.height = '172';
  if (!data.profile.age && !data.profile.birth) data.profile.age = '58';
  for (let w = 0; w < 5; w++) { const t = at(w * 7 + 1, 7, 30); if (t <= now) data.weights.push({ id: uid() + 'w' + w, t, kg: Math.round((77.8 + w * 0.5 + (rnd() - .5) * .6) * 10) / 10, note: '', demo: true }); }
  syncProfileWeight();
  evalBadges(); persist(); render(); if (ui.sheet === 'settings') renderSettings(); toast('Données d’exemple ajoutées');
}

  'undo': () => { if (ui.undo) { storeFor(ui.undo.type).push(ui.undo.rec); if (ui.undo.type === 'weight') syncProfileWeight(); persist(); ui.undo = null; toastEl.classList.remove('show'); render(); } },
  'chart-type': el => { ui.chart = el.dataset.type; ui.selected = null; ui.banner = null; render(); },
  'period': el => { ui.days = parseInt(el.dataset.days, 10); ui.selected = null; render(); },
  'moment-filter': el => { ui.moment = el.dataset.id; ui.selected = null; render(); },
  'hist-filter': el => { ui.hist = el.dataset.id; render(); },
  'dismiss-banner': () => { ui.banner = null; render(); },
  'goto-chart': () => { ui.chart = 'glu'; ui.days = 7; setTab('chart'); },
  'report-days': el => { data.report.days = parseInt(el.dataset.days, 10); persist(); render(); },
  'share-report': () => shareReport(),
  'download-report': () => downloadReport(),
  'sched-day': el => {
    const d = parseInt(el.dataset.day, 10), sc = data.schedule, i = sc.days.indexOf(d);
    if (i >= 0) { if (sc.days.length === 1) { toast('Gardez au moins un jour'); return; } sc.days.splice(i, 1); } else sc.days.push(d);
    persist(); renderSchedule();
  },
  'export-ics': () => exportICS(),
  'set-unit': el => { data.settings.unit = el.dataset.unit; persist(); renderSettings(); },
  'reset-targets': () => { const u = data.settings.unit; data.settings = Object.assign({}, DEFAULT_SETTINGS, { unit: u }); persist(); renderSettings(); toast('Cibles rétablies'); },
  'load-demo': () => loadDemo(),
  'clear-demo': () => { data.readings = data.readings.filter(r => !r.demo); data.bps = data.bps.filter(r => !r.demo); data.weights = data.weights.filter(r => !r.demo); persist(); renderSettings(); render(); toast('Données d’exemple supprimées'); },
  'export-data': () => exportData(),
  'export-xlsx': () => exportXlsx(),
  'open-badges': () => { if (ui.sheet && ui.sheet !== 'badges') closeSheet(); if (ui.sheet !== 'badges') openSheet('badges'); },
  'dismiss-badges': () => { ui.newBadges = null; render(); },
  'imc-senior': () => { data.settings.imcMin = 22; data.settings.imcMax = 27; persist(); renderSettings(); toast('Cible d’IMC : 22 à 27'); },
  'intro-setup': () => { data.settings.introSeen = true; persist(); openSheet('setup'); },
  'intro-badges': () => { data.settings.introSeen = true; persist(); render(); openSheet('badges'); },
  'intro-dismiss': () => { data.settings.introSeen = true; persist(); render(); },
  'setup-done': () => closeSheet(),
  'setup-preset': el => { const p = el.dataset.preset; data.settings.track = p === 'glu' ? { glu: true, bp: false, pulse: false, weight: false } : p === 'bp' ? { glu: false, bp: true, pulse: true, weight: false } : { glu: true, bp: true, pulse: true, weight: true }; persist(); toggleTrack('glu', data.settings.track.glu); },
  'install-app': () => installApp(),
  'install-dismiss': () => { ui.installDismissed = true; render(); },
  'check-update': () => checkUpdate(),
  'reload-app': () => location.reload(),
  'import-data': () => $('#importFile').click(),
  'erase-ask': () => { ui.confirmErase = true; renderSettings(); },
  'erase-cancel': () => { ui.confirmErase = false; renderSettings(); },
  'erase-confirm': () => { data = normalizeData({}); ui.selected = null; ui.banner = null; ui.confirmErase = false; persist(); renderSettings(); render(); toast('Toutes les données ont été effacées'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') return;
  const h = handlers[el.dataset.action]; if (h) h(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'range' && t.dataset && t.dataset.setting) {
    const mn = parseFloat(t.min), mx = parseFloat(t.max), v = parseFloat(t.value), lab = $('#rv-' + t.dataset.setting);
    t.style.setProperty('--p', clamp((v - mn) / (mx - mn) * 100, 0, 100).toFixed(1) + '%');
    if (lab) lab.textContent = fmtNum(v, (t.dataset.kind === 'imc' || (t.dataset.kind === 'glu' && isMmol())) ? 1 : 0) + ' ' + kindUnit(t.dataset.kind);
    return;
  }
  if (t.dataset && t.dataset.bind) {
    const parts = t.dataset.bind.split('.'); data[parts[0]][parts[1]] = t.type === 'checkbox' ? t.checked : t.value; persist();
    if (parts[0] === 'report' || parts[0] === 'profile') updateReportSummary(); return;
  }
  if (!ui.draft || ui.sheet !== 'add') return;
  const d = ui.draft;
  if (t.id === 'fVal') { t.value = t.value.replace(/[^0-9.,]/g, ''); d.val = t.value; }
  else if (t.id === 'fSys' || t.id === 'fDia' || t.id === 'fPulse') { t.value = t.value.replace(/\D/g, '').slice(0, 3); d[t.id === 'fSys' ? 'sys' : t.id === 'fDia' ? 'dia' : 'pulse'] = t.value; }
  else if (t.id === 'fKg') { t.value = t.value.replace(/[^0-9.,]/g, ''); d.kg = t.value; }
  else if (t.id === 'fHeight') { t.value = t.value.replace(/\D/g, '').slice(0, 3); d.height = t.value; }
  else if (t.id === 'fNote') { d.note = t.value; return; }
  else if (t.id === 'fDate') {
    if (parseDateKey(t.value) == null) return;
    d.dateStr = t.value; d.dateSet = true; d.auto = !d.id && t.value === dateKey(Date.now());
    updateEntryMeta(); return;
  } else return;
  const e2 = $('#fErr'); if (e2) e2.hidden = true;
  updatePreview();
});
document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset || {};
  if (ds.pnum !== undefined) { commitProfileNum(t); return; }
  if (ds.track !== undefined) { toggleTrack(ds.track, t.checked, t); return; }
  if (ds.setting) { commitSetting(t); return; }
  if (ds.slotTime !== undefined) { if (/^\d{2}:\d{2}$/.test(t.value)) { data.schedule.slots[ds.slotTime].time = t.value; data.schedule.fired = {}; persist(); } else renderSchedule(); return; }
  if (ds.slotOn !== undefined) { data.schedule.slots[ds.slotOn].on = t.checked; persist(); return; }
  if (ds.notif !== undefined) {
    if (!t.checked) { data.schedule.notify = false; persist(); return; }
    try {
      const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      data.schedule.notify = perm === 'granted'; persist();
      if (perm !== 'granted') { toast('Notifications refusées : autorisez-les dans les réglages du navigateur'); renderSchedule(); }
      else toast('Notifications activées');
    } catch (err) { data.schedule.notify = false; persist(); toast('Notifications indisponibles ici'); renderSchedule(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) closeSheet();
  if (e.key === 'Enter' && ui.sheet === 'add' && e.target.tagName === 'INPUT' && e.target.id !== 'fNote' && e.target.id !== 'fDate') { e.preventDefault(); saveDraft(); }
});
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ''; });

/* =====================================================================
   Démarrage
   ===================================================================== */
evalBadges();
render();
try {
  const q = new URLSearchParams(location.search), add = q.get('add');
  if (add === 'glu' || add === 'bp') openSheet('add', { type: add, moment: q.get('moment') || undefined });
} catch (e) { /* ignoré */ }
setTimeout(checkReminders, 1500);
setTimeout(() => { if (!data.settings.setupDone && !ui.sheet) openSheet('setup'); }, 350);
/*PWA:START*/
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne non disponible */ }); });
}
/*PWA:END*/
})();
</script>
</body>
</html>
